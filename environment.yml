name: cds525
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.10

  # PyTorch (CUDA 11.8 for P40)
  - pytorch=2.1
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8

  # Data Science
  - pandas
  - numpy
  - scikit-learn
  - scipy

  # Visualization
  - matplotlib
  - seaborn

  # Jupyter
  - jupyter
  - jupyterlab
  - ipykernel

  # Utilities
  - tqdm
  - pyyaml

  # pip dependencies
  - pip
  - pip:
    # NLP
    - transformers
    - datasets
    - tokenizers

    # Training utilities
    - accelerate
    - wandb

    # Text processing
    - wordcloud
    - nltk

    # Additional
    - pyarrow  # for parquet files
